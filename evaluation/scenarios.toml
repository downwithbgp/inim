# Evaluation scenario manifest — NOC alpha evaluation
#
# Authored reviewed configuration: scenario IDs, starting URLs, task
# assignments, and intended semantic concepts for the external alpha
# evaluation. This file contains NO answers. It is deterministic: it
# must not depend on generated state, absolute paths, or ports.
#
# Field reference:
#   id                 — stable scenario identifier (kebab-case)
#   title              — display name shown to the evaluator
#   path               — relative workbench URL (host/port are added by
#                        the bootstrap; never embed a port here)
#   source_case        — repository case-study or event slug
#   task_ids           — task IDs from NOC-ALPHA-TASKS.md that this
#                        scenario supports
#   prerequisite_task_ids — tasks the evaluator should complete first
#   concepts           — intended semantic concepts (facilitator
#                        vocabulary; never shown to the evaluator)
#   status             — evaluator | optional | facilitator-only
#
# Scenario URLs are verified against the deterministic demo by the
# evaluation drift guards and the CI evaluation-smoke job.

schema_version = 1

