[package]
name = "inim"
version = "0.1.0"
edition = "2021"
authors = ["Vadim Petrov <vadim@vadimpetrov.com>"]
license = "MIT"
description = "Internetwork Impact Monitor — determine how planned or unplanned network events affect the globally visible routing system"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bgpkit-parser = { version = "=0.19.0", default-features = false, features = ["parser", "local"] }
bgpkit-broker = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking"] }

[dev-dependencies]

[lib]
path = "src/lib.rs"

[[bin]]
name = "inim"
path = "src/main.rs"
