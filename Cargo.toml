[package]
name = "inim"
version = "0.1.0"
edition = "2021"
authors = ["Vadim Petrov <vadim@vadimpetrov.com>"]
license = "MIT"
description = "Internetwork Impact Monitor — compare operator-declared network events with externally observable BGP route behavior from selected public collectors"
readme = "README.md"
keywords = ["bgp", "routing", "network-events", "routeviews", "observability"]
categories = ["command-line-utilities", "network-programming"]
# Packaging: exclude caches, raw MRT archives, generated event outputs,
# validation/archived runs, and local scratch files. The crate ships only
# source, tests/fixtures (provenance-documented, MIT-compatible), and docs.
exclude = [
    "out/",
    "tmp/",
    "cache/",
    "run_stderr*.log",
    "data/",
    "*.sqlite",
    "*.sqlite-wal",
    "*.sqlite-shm",
    "*.db",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bgpkit-parser = { version = "=0.19.0", default-features = false, features = ["parser", "local"] }
bgpkit-broker = "0.12"
sha2 = "0.10"
flate2 = "1"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
axum = "0.8.9"
askama = "0.16.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
http = "1" 

[lib]
path = "src/lib.rs"

[[bin]]
name = "inim"
path = "src/main.rs"
