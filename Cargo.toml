[package]
name = "inim"
version = "0.1.0"
edition = "2021"
authors = ["Vadim Petrov <vadim@downwithbgp.net>"]
license = "MIT"
description = "Internetwork Impact Monitor — determine how planned or unplanned network events affect the globally visible routing system"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[dev-dependencies]

[lib]
path = "src/lib.rs"

[[bin]]
name = "inim"
path = "src/main.rs"
