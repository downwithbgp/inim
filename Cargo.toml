[package]
name = "inim"
version = "0.1.0"
edition = "2021"
authors = ["Vadim Petrov <vadim@vadimpetrov.com>"]
license = "MIT"
description = "Internetwork Impact Monitor — compare operator-declared network events with externally observable BGP route behavior from selected public collectors"
readme = "README.md"
keywords = ["bgp", "routing", "network-events", "routeviews", "observability"]
categories = ["command-line-utilities", "network-programming"]
# Packaging: exclude caches, raw MRT archives, generated event outputs,
# validation/archived runs, and local scratch files. The crate ships only
# source, tests/fixtures (provenance-documented, MIT-compatible), and docs.
exclude = ["out/", "cache/", "run_stderr*.log"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
bgpkit-parser = { version = "=0.19.0", default-features = false, features = ["parser", "local"] }
bgpkit-broker = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "inim"
path = "src/main.rs"
