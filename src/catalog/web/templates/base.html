<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}inim catalog{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>inim — local event catalog</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/events">Events</a>
    <a href="/case-studies">Case studies</a>
    <a href="/corpus">Corpus</a>
    <a href="/analysis-queue">Analysis queue</a>
    <a href="/analysis-jobs">Analysis jobs</a>
    <a href="/incident-candidates">Candidates</a>
    <a href="/archive-batches">Archive batches</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
/* Progressive enhancement: mark the active nav item from the path. */
(function () {
  var path = location.pathname;
  document.querySelectorAll('nav a').forEach(function (a) {
    var href = a.getAttribute('href');
    if (href === '/' && path === '/') { a.classList.add('active'); }
    else if (href !== '/' && path.indexOf(href) === 0) { a.classList.add('active'); }
  });
})();
</script>
</body>
</html>
