# CI: offline-safe quality gates. No live GRNOC, RouteViews, or RIPE RIS
# access runs here — every test uses tracked fixtures and reviewed
# case-study evidence from the repository. No analysis reruns, no
# canonical-evidence mutation, no screenshots, no runtime data, no
# package publication.
#
# Action pinning policy: third-party actions are pinned to a full commit
# SHA with the reviewed release tag in a trailing comment. Exception:
# dtolnay/rust-toolchain uses `@stable` because its documented interface
# IS a toolchain selector (branch-like revision); the component set is
# fixed in the workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format check
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test
        run: cargo test
      - name: Doc tests
        run: cargo test --doc

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy (all targets, all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
      - name: Documentation drift audit
        run: scripts/audit-docs.sh

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deny licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
      - name: Deny bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Package
        run: cargo package
      - name: Package contents exclude runtime material
        run: |
          if cargo package --list | grep -E '(^|/)(cache|data|tmp)/|\.sqlite|\.pdf|\.png$|stderr\.log'; then
            echo "runtime material packaged" >&2
            exit 1
          fi
          echo "package contents clean"

  # Offline end-to-end queued-analysis smoke (Part 59): build a fresh
  # catalog, queue the synthetic fixture plan, run the worker once in
  # offline mode against the tracked MRT fixture, verify the completed
  # run, then serve the job + workbench pages. No RouteViews, RIPE RIS,
  # GRNOC, or any other network access. No GitHub write token.
  queued-analysis-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --locked
      - name: Offline queued-analysis smoke
        env:
          RUST_BACKTRACE: 0
        run: |
          cargo test --locked --test queued_analysis_e2e_test
          cargo test --locked --test job_workflow_tests direct_execution_and_queued_execution_are_semantically_identical
          cargo test --locked --test grnoc_reconciliation_test
          cargo test --locked --lib catalog::jobs::cleanup
          cargo test --locked --lib catalog::jobs::stage_skip_tests
      - name: Project-scope smoke (offline)
        env:
          RUST_BACKTRACE: 0
        run: |
          ./target/debug/inim project-scope show --root . > /tmp/scope.txt
          grep -q "schema v1" /tmp/scope.txt
          cargo test --locked --test project_scope_policy_test
          cargo test --locked --test project_scope_enforcement_test
          ./target/debug/inim demo init --db /tmp/ci-demo.sqlite --root . --force
          ./target/debug/inim demo verify --db /tmp/ci-demo.sqlite --root . | grep -q "demo verify: ok"
          python3 - <<'PY'
          import json, sqlite3
          c = sqlite3.connect('/tmp/ci-demo.sqlite')
          n = c.execute("SELECT COUNT(*) FROM catalog_events WHERE external_id='INC0303298'").fetchone()[0]
          assert n == 0, "demo must not contain the excluded event"
          PY
          if cargo package --list | grep -E 'inc0303298|INC0303298'; then
            echo "excluded case material packaged" >&2
            exit 1
          fi
          echo "project-scope smoke ok"

  # Evaluation kit smoke (Session 51): build the demo, generate the
  # answer key, build the evaluation pack, serve read-only, and verify
  # all scenario URLs, read-only behavior, no external assets, and no
  # database mutation. Fully offline. No GitHub write token; nothing is
  # uploaded (no demo DB, no pack, no screenshots).
  evaluation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release --locked
      - name: Fresh demo + answer key + pack
        env:
          RUST_BACKTRACE: 0
        run: |
          ./target/release/inim demo init --db /tmp/eval-demo.sqlite --root . --force
          ./target/release/inim demo verify --db /tmp/eval-demo.sqlite --root . | grep -q "demo verify: ok"
          ./target/release/inim project-scope audit --db /tmp/eval-demo.sqlite --root . | grep -q "excluded events in catalog: 0"
          python3 scripts/build-evaluation-answer-key.py --db /tmp/eval-demo.sqlite --root . --out evaluation/generated
          # Answer-key regeneration drift: regeneration must produce no diff.
          python3 scripts/build-evaluation-answer-key.py --db /tmp/eval-demo.sqlite --root . --out /tmp/answerkey-drift
          diff -r evaluation/generated /tmp/answerkey-drift
          sh scripts/build-evaluation-pack.sh --output /tmp/eval-pack --db /tmp/eval-demo.sqlite --root .
          test -f /tmp/eval-pack/SHA256SUMS
          test ! -e /tmp/eval-pack/*.sqlite
          echo "demo + answer key + pack ok"
      - name: Read-only server + scenario URLs
        run: |
          ./target/release/inim serve --db /tmp/eval-demo.sqlite --root . --bind 127.0.0.1:8099 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          python3 - <<'PY'
          import subprocess, tomllib, urllib.request, urllib.error, hashlib, re, sqlite3

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          base = "http://127.0.0.1:8099"
          # All scenario URLs must return 200.
          with open("evaluation/scenarios.toml", "rb") as f:
              manifest = tomllib.load(f)
          paths = [s["path"] for s in manifest["scenarios"]]
          for p in paths:
              status, body = get(base + p)
              assert status == 200, f"{p} returned {status}"
              assert "CSRF" not in body, f"{p} renders write-mode controls"
          # Core pages render.
          for p in ["/", "/events", "/case-studies", "/analysis-queue"]:
              status, _ = get(base + p)
              assert status == 200, f"{p} returned {status}"
          # Excluded items return 404 (project-scope exclusion).
          status, _ = get(base + "/events/INC0303298")
          assert status == 404, "excluded event must 404"
          # No write controls in read-only mode: mutation routes reject.
          import urllib.request as u
          for p in ["/analysis-jobs/1/cancel", "/analysis-jobs/1/retry",
                    "/events/INC0299001/analysis-plan"]:
              req = u.Request(base + p, data=b"", method="POST")
              try:
                  u.urlopen(req, timeout=10)
                  raise AssertionError(f"POST {p} unexpectedly succeeded")
              except urllib.error.HTTPError as e:
                  assert e.code in (404, 405, 415), f"POST {p} -> {e.code}"
          # No external asset URLs in the served HTML.
          for p in paths:
              _, body = get(base + p)
              for m in re.findall(r'(?:src|href)="(https?://[^"]+)"', body):
                  host = urllib.parse.urlparse(m).netloc
                  assert host == "127.0.0.1:8099", f"external asset on {p}: {m}"
          # Database bytes unchanged by the browse session.
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()
          before = sha("/tmp/eval-demo.sqlite")
          after = sha("/tmp/eval-demo.sqlite")
          assert before == after, "database mutated by read-only browse"
          print("read-only server smoke ok")
          PY
      - name: Excluded-material scan of evaluation artifacts
        run: |
          if grep -rniE 'NOAA|INC0303298' evaluation/ docs/evaluation/; then
            echo "excluded material in evaluation artifacts" >&2
            exit 1
          fi
          echo "evaluation material clean"
