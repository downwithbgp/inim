# CI: offline-safe quality gates. No live GRNOC, RouteViews, or RIPE RIS
# access runs here — every test uses tracked fixtures and reviewed
# case-study evidence from the repository. No analysis reruns, no
# canonical-evidence mutation, no screenshots, no runtime data, no
# package publication.
#
# Action pinning policy: third-party actions are pinned to a full commit
# SHA with the reviewed release tag in a trailing comment. Exception:
# dtolnay/rust-toolchain uses `@stable` because its documented interface
# IS a toolchain selector (branch-like revision); the component set is
# fixed in the workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format check
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Test
        run: cargo test
      - name: Doc tests
        run: cargo test --doc

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Clippy (all targets, all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
      - name: Documentation drift audit
        run: scripts/audit-docs.sh

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deny licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
      - name: Deny bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Package
        run: cargo package
      - name: Package contents exclude runtime material
        run: |
          if cargo package --list | grep -E '(^|/)(cache|data|tmp)/|\.sqlite|\.pdf|\.png$|stderr\.log'; then
            echo "runtime material packaged" >&2
            exit 1
          fi
          echo "package contents clean"

  # Offline end-to-end queued-analysis smoke (Part 59): build a fresh
  # catalog, queue the synthetic fixture plan, run the worker once in
  # offline mode against the tracked MRT fixture, verify the completed
  # run, then serve the job + workbench pages. No RouteViews, RIPE RIS,
  # GRNOC, or any other network access. No GitHub write token.
  queued-analysis-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build
        run: cargo build --locked
      - name: Offline queued-analysis smoke
        env:
          RUST_BACKTRACE: 0
        run: |
          cargo test --locked --test queued_analysis_e2e_test
          cargo test --locked --test job_workflow_tests direct_execution_and_queued_execution_are_semantically_identical
